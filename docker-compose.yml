services:
  pathfinder:
    build: .
    ports:
      - "3005:3000"
    environment:
      PORT: 3000
      GRAPH_PATH: /app/data/graph.bin
      CACHE_SIZE: 10000
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
